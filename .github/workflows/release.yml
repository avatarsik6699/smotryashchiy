name: Release

# Triggered by a version tag (docs/SPEC.md §4g). Builds and gates the image locally first; only on
# PASS does it push to GHCR and publish the GitHub Release with the binaries attached. A release
# that fails smoke or the vulnerability scan is never published.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, gate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Release binaries
        run: bash scripts/build-release.sh

      - name: Image smoke test (native arch)
        run: bash scripts/image-smoke.sh smotryashchiy:smoke

      - name: Image vulnerability scan
        run: bash scripts/image-scan.sh smotryashchiy:smoke

      # Everything above proved the image works and is clean. Only now does the release become
      # observable outside this job: multi-arch build, push, and the GitHub Release.
      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smotryashchiy:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/smotryashchiy:latest

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            release/smotryashchiy-linux-amd64 \
            release/smotryashchiy-linux-arm64 \
            release/SHA256SUMS
