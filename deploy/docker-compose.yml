# Example deployment of the smotryashchiy server (docs/DEPLOY.md).
#
# Production mode is fail-closed: it refuses to start without the settings below. Until built-in
# ACME lands (Change 10) put a TLS-terminating reverse proxy in front of port 8080 and list its
# address in SMOTRYASHCHIY_TRUSTED_PROXY_CIDRS.
#
# First run: set the admin password (stdin only, >= 24 bytes), then start:
#   printf '%s\n' "$PASSWORD" | docker compose run --rm -T server admin set-password
#   docker compose up -d
services:
  server:
    image: ghcr.io/avatarsik6699/smotryashchiy:latest
    restart: unless-stopped
    read_only: true            # the image writes only under /data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SMOTRYASHCHIY_PRODUCTION: "true"
      # The URL agents use to enroll and the operator opens (https, behind your proxy).
      SMOTRYASHCHIY_PUBLIC_URL: "https://monitor.example.com"
      # host:port agents dial for the WireGuard tunnel (UDP, must be reachable from your hosts).
      SMOTRYASHCHIY_PUBLIC_ENDPOINT: "monitor.example.com:51820"
      # Address(es) of your reverse proxy as seen by the container.
      SMOTRYASHCHIY_TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
    ports:
      - "127.0.0.1:8080:8080"  # HTTP, meant for the reverse proxy on the same host
      - "51820:51820/udp"      # WireGuard tunnel for agents
    volumes:
      - smotryashchiy-data:/data

volumes:
  smotryashchiy-data:
